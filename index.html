<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Falling Stars!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            background: #1e293b;
        }

        .ui-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .lives-board {
            color: #ef4444;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #1e1b4b, #0f172a);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: all 0.3s ease;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        h1.danger {
            color: #f43f5e;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #94a3b8;
        }

        .btn-group button, .overlay button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 10px;
            background: #3b82f6;
            color: white;
            transition: transform 0.1s, background 0.2s;
        }

        .btn-group button:hover, .overlay button:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn-group button:active, .overlay button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="ui-panel">
            <div class="score-board">Score: <span id="score">0</span></div>
            <div class="lives-board">Lives: <span id="lives">♥♥♥</span></div>
        </div>
        
        <canvas id="gameCanvas" width="600" height="500"></canvas>
        
        <div id="menuOverlay" class="overlay">
            <h1>Catch the Stars!</h1>
            <p>Pilih tingkat kesulitan untuk memulai:</p>
            <div class="btn-group">
                <button onclick="startGame('easy')">Easy</button>
                <button onclick="startGame('medium')">Medium</button>
                <button onclick="startGame('hard')">Hard</button>
            </div>
        </div>

        <div id="gameOverOverlay" class="overlay hidden">
            <h1 class="danger">Game Over!</h1>
            <p>Skor Akhir Kamu: <span id="finalScore">0</span></p>
            <button onclick="resetToMenu()">Main Lagi</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let lives = 3;
        let gameOver = false;
        let gameActive = false;
        let speedMultiplier = 1;
        let animationFrameId;

        // Entities
        let player = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            color: '#38bdf8'
        };

        let items = [];
        let particles = [];

        // Input handler (Mouse & Touch)
        canvas.addEventListener('mousemove', (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const root = document.documentElement;
            const mouseX = e.clientX - rect.left - root.scrollLeft;
            
            player.x = mouseX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = touchX - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
            e.preventDefault();
        }, { passive: false });

        function startGame(difficulty) {
            document.getElementById('menuOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            
            if (difficulty === 'easy') speedMultiplier = 1.5;
            if (difficulty === 'medium') speedMultiplier = 2.5;
            if (difficulty === 'hard') speedMultiplier = 4;
            
            score = 0;
            lives = 3;
            gameOver = false;
            gameActive = true;
            items = [];
            particles = [];
            
            updateUI();
            gameLoop();
        }

        function spawnItem() {
            if (Math.random() < 0.03) {
                const isBomb = Math.random() < 0.25;
                items.push({
                    x: Math.random() * (canvas.width - 20) + 10,
                    y: -10,
                    radius: isBomb ? 12 : 8,
                    speed: (Math.random() * 2 + 1) * speedMultiplier,
                    isBomb: isBomb,
                    color: isBomb ? '#ef4444' : '#fbbf24'
                });
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1
                });
            }
        }

        function update() {
            spawnItem();

            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                if (item.y + item.radius >= player.y && 
                    item.x >= player.x && 
                    item.x <= player.x + player.width) {
                    
                    if (item.isBomb) {
                        lives--;
                        createParticles(item.x, item.y, '#ef4444');
                    } else {
                        score += 10;
                        createParticles(item.x, item.y, '#fbbf24');
                    }
                    
                    items.splice(i, 1);
                    updateUI();
                    
                    if (lives <= 0) {
                        endGame();
                    }
                    continue;
                }

                if (item.y - item.radius > canvas.height) {
                    if (!item.isBomb) {
                        lives--;
                        updateUI();
                        if (lives <= 0) endGame();
                    }
                    items.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 8);
            ctx.fill();

            items.forEach(item => {
                ctx.fillStyle = item.color;
                ctx.beginPath();
                ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 10;
                ctx.shadowColor = item.color;
            });
            ctx.shadowBlur = 0;

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function updateUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('lives').innerText = '♥'.repeat(Math.max(0, lives));
        }

        function endGame() {
            gameActive = false;
            gameOver = true;
            cancelAnimationFrame(animationFrameId);
            document.getElementById('finalScore').innerText = score;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function resetToMenu() {
            document.getElementById('gameOverOverlay').classList.add('hidden');
            document.getElementById('menuOverlay').classList.remove('hidden');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function gameLoop() {
            if (!gameActive) return;
            update();
            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
